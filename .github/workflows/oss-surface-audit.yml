name: OSS Surface Audit

# Runs the public-surface leak audit (scripts/audit_oss_surface.sh) on every
# push and pull request — deliberately no path filter, because a leak can land
# in any file (docs, launch copy, scripts, workflows alike).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: oss-surface-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Audit public OSS surface
        shell: bash
        run: ./scripts/audit_oss_surface.sh
